name: Android CI Build & Release Sign

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore from Secret
      env:
        KEYSTORE_RAW: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        echo "$KEYSTORE_RAW" | base64 --decode > app/keystore.jks
        ls -la app/keystore.jks

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: "meinpasswort123"
        KEY_ALIAS: "fttkey"
        KEY_PASSWORD: "meinpasswort123"
      run: ./gradlew assembleRelease -PappVersionCode=${{ github.run_number }} --stacktrace

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ftt-tracker-signed-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 14