name: Build FTT Tracker APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Rename APK to FTT-Tracker.apk
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FTT-Tracker.apk

    - name: Upload FTT-Tracker Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FTT-Tracker-APK
        path: app/build/outputs/apk/debug/FTT-Tracker.apk
        retention-days: 14